<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Basketball Quarters Scoreboard - Buho Vision</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial Black', 'Arial', sans-serif;
            background: transparent;
            display: inline-block;
            padding: 10px;
        }

        .scoreboard-wrapper {
            display: inline-block;
            width: fit-content;
        }

        /* ── HEADER ROW (column labels) ── */
        .header-row {
            display: flex;
            align-items: center;
            padding: 0 0 6px 0;
            margin-bottom: 2px;
        }

        .header-team-space {
            flex: 1;
        }

        .header-quarters {
            display: flex;
            gap: 0;
        }

        .header-q {
            width: 90px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-total {
            width: 110px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #555;
            letter-spacing: 1px;
        }

        /* ── TEAM ROW ── */
        .team-row {
            display: flex;
            align-items: center;
            height: 110px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            margin-bottom: 4px;
            border-radius: 6px;
            overflow: hidden;
        }

        .team-row.winner {
            background: #ffffff;
        }

        /* Team logo */
        .team-logo-cell {
            width: 100px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 8px;
            background: #e8e8e8;
            border-right: 1px solid #ccc;
        }

        .team-logo-cell img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .team-logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0066cc, #004499);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 900;
        }

        /* Team name */
        .team-name-cell {
            flex: 1;
            padding: 0 20px;
            font-size: 34px;
            font-weight: 900;
            color: #1a1a1a;
            white-space: nowrap;
        }

        /* Quarter scores */
        .quarter-scores {
            display: flex;
            gap: 0;
            flex-shrink: 0;
        }

        .q-cell {
            width: 90px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #333;
            border-left: 1px solid #d0d0d0;
        }

        .q-cell.highlight {
            color: #0066cc;
            font-weight: 900;
        }

        /* Total score */
        .total-cell {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .total-cell.winner-total {
            background: #1a6bbf;
            color: white;
        }

        .total-cell.loser-total {
            background: #888888;
            color: white;
        }

        /* ── LEAGUE LOGO + BOTTOM BAR ── */
        .bottom-bar {
            display: none;
        }

        .league-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .league-name {
            font-size: 18px;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="scoreboard-wrapper" id="scoreboard">

        <!-- Header labels -->
        <div class="header-row">
            <div style="width:100px;flex-shrink:0;"></div>
            <div class="header-team-space"></div>
            <div class="header-quarters">
                <div class="header-q">1C</div>
                <div class="header-q">2C</div>
                <div class="header-q">3C</div>
                <div class="header-q">4C</div>
            </div>
            <div class="header-total">Resul.</div>
        </div>

        <!-- Home team row -->
        <div class="team-row" id="home-row">
            <div class="team-logo-cell">
                <img id="home-logo" src="" alt="" style="display:none;">
                <div class="team-logo-placeholder" id="home-placeholder"><span id="home-initials">H</span></div>
            </div>
            <div class="team-name-cell" id="home-name">HOME TEAM</div>
            <div class="quarter-scores">
                <div class="q-cell" id="home-q1">-</div>
                <div class="q-cell" id="home-q2">-</div>
                <div class="q-cell" id="home-q3">-</div>
                <div class="q-cell" id="home-q4">-</div>
            </div>
            <div class="total-cell" id="home-total">-</div>
        </div>

        <!-- Away team row -->
        <div class="team-row" id="away-row">
            <div class="team-logo-cell">
                <img id="away-logo" src="" alt="" style="display:none;">
                <div class="team-logo-placeholder" id="away-placeholder"><span id="away-initials">A</span></div>
            </div>
            <div class="team-name-cell" id="away-name">AWAY TEAM</div>
            <div class="quarter-scores">
                <div class="q-cell" id="away-q1">-</div>
                <div class="q-cell" id="away-q2">-</div>
                <div class="q-cell" id="away-q3">-</div>
                <div class="q-cell" id="away-q4">-</div>
            </div>
            <div class="total-cell" id="away-total">-</div>
        </div>

        <!-- Bottom bar with league logo -->
        <div class="bottom-bar">
            <img class="league-logo" id="league-logo" src="" alt="" style="display:none;">
            <div class="league-name" id="league-name">LIGA FEMENINA BASKETBALL</div>
        </div>

    </div>

    <script>
        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 3);
        }

        function updateScoreboard(data) {
            // Team names
            document.getElementById('home-name').textContent = data.homeTeam;
            document.getElementById('away-name').textContent = data.awayTeam;
            document.getElementById('home-initials').textContent = getInitials(data.homeTeam);
            document.getElementById('away-initials').textContent = getInitials(data.awayTeam);

            // Logos
            if (data.homeLogo) {
                const img = document.getElementById('home-logo');
                img.src = data.homeLogo;
                img.style.display = 'block';
                document.getElementById('home-placeholder').style.display = 'none';
            }
            if (data.awayLogo) {
                const img = document.getElementById('away-logo');
                img.src = data.awayLogo;
                img.style.display = 'block';
                document.getElementById('away-placeholder').style.display = 'none';
            }

            // Quarter scores
            const hq = data.homeQuarters;
            const aq = data.awayQuarters;

            ['q1','q2','q3','q4'].forEach((q, i) => {
                const hCell = document.getElementById(`home-${q}`);
                const aCell = document.getElementById(`away-${q}`);
                hCell.textContent = hq[i] !== undefined ? hq[i] : '-';
                aCell.textContent = aq[i] !== undefined ? aq[i] : '-';

                // Highlight the higher quarter score in blue
                const hVal = parseInt(hq[i]) || 0;
                const aVal = parseInt(aq[i]) || 0;
                if (hVal > aVal) { hCell.classList.add('highlight'); }
                else if (aVal > hVal) { aCell.classList.add('highlight'); }
            });

            // Totals: values are already cumulative (last quarter cell = total)
            const hTotalVal = data.homeTotal !== null && data.homeTotal !== undefined
                ? parseInt(data.homeTotal) : null;
            const aTotalVal = data.awayTotal !== null && data.awayTotal !== undefined
                ? parseInt(data.awayTotal) : null;

            if (hTotalVal !== null && aTotalVal !== null) {
                document.getElementById('home-total').textContent = hTotalVal;
                document.getElementById('away-total').textContent = aTotalVal;
                // Only apply winner/loser color on the final graphic (all 4 quarters shown)
                if (hq.length === 4) {
                    if (hTotalVal >= aTotalVal) {
                        document.getElementById('home-total').className = 'total-cell winner-total';
                        document.getElementById('away-total').className = 'total-cell loser-total';
                        document.getElementById('home-row').classList.add('winner');
                    } else {
                        document.getElementById('away-total').className = 'total-cell winner-total';
                        document.getElementById('home-total').className = 'total-cell loser-total';
                        document.getElementById('away-row').classList.add('winner');
                    }
                } else {
                    // Intermediate: neutral styling on total
                    document.getElementById('home-total').className = 'total-cell';
                    document.getElementById('away-total').className = 'total-cell';
                }
            } else {
                document.getElementById('home-total').textContent = '-';
                document.getElementById('away-total').textContent = '-';
            }

            // League
            if (data.leagueLogo) {
                const ll = document.getElementById('league-logo');
                ll.src = data.leagueLogo;
                ll.style.display = 'block';
            }
            if (data.leagueName) {
                document.getElementById('league-name').textContent = data.leagueName;
            }
        }

        // Test data
        window.onload = () => updateScoreboard({
            homeTeam: 'Lagomar Country Club',
            awayTeam: 'Cordón',
            homeQuarters: [35, 16, 20, 22],
            awayQuarters: [12, 7, 11, 26],
            homeTotal: 93,
            awayTotal: 56,
            homeLogo: '', awayLogo: '', leagueLogo: '',
            leagueName: 'LIGA FEMENINA BASKETBALL'
        });
    </script>
</body>
</html>
