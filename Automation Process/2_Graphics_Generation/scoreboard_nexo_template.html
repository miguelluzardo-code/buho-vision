<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Nexo - Buho Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        .scoreboard-wrapper {
            width: 1890px;
            height: 220px;
            position: relative;
        }

        /* ========== BASE LAYER - Blue border bar ========== */
        .base-bar {
            position: absolute;
            bottom: 0;
            left: 45px;
            right: 45px;
            height: 45px;
            background: linear-gradient(180deg, #154a6e 0%, #0d3a54 100%);
            clip-path: polygon(2.5% 0, 97.5% 0, 100% 100%, 0 100%);
            z-index: 1;
        }

        /* ========== MAIN BODY - Gray sections ========== */
        .main-bar {
            position: absolute;
            top: 10px;
            left: 30px;
            right: 30px;
            height: 120px;
            background: linear-gradient(180deg, #f5f5f5 0%, #e5e5e5 50%, #d8d8d8 100%);
            border: 2px solid #a0a0a0;
            clip-path: polygon(1.8% 0, 98.2% 0, 99.5% 100%, 0.5% 100%);
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        /* ========== TEAM NAMES - Company names filling the sides ========== */
        .team-name-block {
            position: absolute;
            top: 10px;
            height: 120px;
            width: 620px;
            display: flex;
            align-items: center;
            z-index: 15;
        }

        .team-name-block.home {
            left: 60px;
            justify-content: flex-start;
        }

        .team-name-block.away {
            right: 60px;
            justify-content: flex-end;
        }

        .team-name-block .company-name {
            font-size: 68px;
            font-weight: 900;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            text-align: left;
            max-width: 100%;
        }

        .team-name-block .company-name span {
            display: block;
        }

        .team-name-block.away .company-name {
            text-align: right;
        }

        /* ========== CENTER SECTION ========== */
        .center-group {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 0;
            z-index: 10;
        }

        /* Score boxes */
        .score-box {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            border: 2px solid #a0a0a0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .score-box.left {
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            margin-right: -8px;
            z-index: 11;
        }

        .score-box.right {
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
            margin-left: -8px;
            z-index: 11;
        }

        .score {
            font-size: 95px;
            font-weight: 900;
            color: #ffffff;
            text-shadow:
                2px 2px 4px rgba(0,0,0,0.9),
                0 0 10px rgba(255,255,255,0.2);
            letter-spacing: -4px;
            line-height: 1;
        }

        .score.penalty {
            font-size: 45px;
            letter-spacing: -1px;
        }

        /* Diamond with league logo */
        .diamond {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #0d4a6e 0%, #1a5a7e 50%, #0d4a6e 100%);
            transform: rotate(45deg);
            border: 2px solid #a0a0a0;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            z-index: 12;
        }

        .diamond-inner {
            position: absolute;
            width: 125px;
            height: 125px;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 50%, #e8e8e8 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .league-logo-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 13;
        }

        .league-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(-45deg);
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div class="scoreboard-wrapper">
        <!-- Base blue bar -->
        <div class="base-bar"></div>

        <!-- Main gray bar -->
        <div class="main-bar"></div>

        <!-- Home team name -->
        <div class="team-name-block home">
            <div class="company-name" id="home-name"></div>
        </div>

        <!-- Away team name -->
        <div class="team-name-block away">
            <div class="company-name" id="away-name"></div>
        </div>

        <!-- Center group with scores and logo -->
        <div class="center-group">
            <!-- Left score -->
            <div class="score-box left">
                <div class="score" id="home-score">2</div>
            </div>

            <!-- Diamond with league logo -->
            <div class="diamond">
                <div class="diamond-inner"></div>
                <div class="league-logo-wrapper">
                    <img class="league-logo" id="league-logo" src="" alt="">
                </div>
            </div>

            <!-- Right score -->
            <div class="score-box right">
                <div class="score" id="away-score">1</div>
            </div>
        </div>
    </div>

    <script>
        function updateScoreboard(data) {
            // Update team names (use | as explicit line break)
            function renderName(el, name) {
                const parts = name.split('~');
                el.innerHTML = parts.map(p => `<span>${p}</span>`).join('');
            }
            renderName(document.getElementById('home-name'), data.homeTeam);
            renderName(document.getElementById('away-name'), data.awayTeam);

            // Update scores
            const homeScoreEl = document.getElementById('home-score');
            const awayScoreEl = document.getElementById('away-score');

            homeScoreEl.textContent = data.homeScore;
            awayScoreEl.textContent = data.awayScore;

            if (data.homeScore.includes('(') || data.awayScore.includes('(')) {
                homeScoreEl.classList.add('penalty');
                awayScoreEl.classList.add('penalty');
            } else {
                homeScoreEl.classList.remove('penalty');
                awayScoreEl.classList.remove('penalty');
            }

            // Update league logo
            if (data.leagueLogo) {
                document.getElementById('league-logo').src = data.leagueLogo;
            }
        }

        const testData = {
            homeTeam: 'SANCOR SEGUROS',
            awayTeam: 'HORMIGONES URUGUAY',
            homeScore: '2',
            awayScore: '1',
            leagueLogo: ''
        };

        window.onload = () => updateScoreboard(testData);
    </script>
</body>
</html>
