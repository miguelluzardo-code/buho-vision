<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Generator - Buho Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        .scoreboard-wrapper {
            width: 1890px;
            height: 220px;
            position: relative;
        }

        /* ========== BASE LAYER - Blue border bar ========== */
        .base-bar {
            position: absolute;
            bottom: 0;
            left: 45px;
            right: 45px;
            height: 45px;
            background: linear-gradient(180deg, #154a6e 0%, #0d3a54 100%);
            clip-path: polygon(2.5% 0, 97.5% 0, 100% 100%, 0 100%);
            z-index: 1;
        }

        /* ========== MAIN BODY - Gray sections ========== */
        .main-bar {
            position: absolute;
            top: 10px;
            left: 30px;
            right: 30px;
            height: 120px;
            background: linear-gradient(180deg, #f5f5f5 0%, #e5e5e5 50%, #d8d8d8 100%);
            border: 2px solid #a0a0a0;
            clip-path: polygon(1.8% 0, 98.2% 0, 99.5% 100%, 0.5% 100%);
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        /* ========== CONTENT CONTAINER ========== */
        .content-container {
            position: absolute;
            top: 10px;
            left: 30px;
            right: 30px;
            height: 120px;
            z-index: 20;
        }

        /* ========== LEFT TEAM SECTION ========== */
        .left-team {
            position: absolute;
            left: 65px;
            top: 50%;
            transform: translateY(-50%);
            width: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            overflow: hidden;
        }

        .left-team .team-name {
            font-size: 42px;
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            line-height: 1;
            max-width: 100%;
            text-align: center;
            word-spacing: 9999px;
        }

        /* ========== RIGHT TEAM SECTION ========== */
        .right-team {
            position: absolute;
            right: 65px;
            top: 50%;
            transform: translateY(-50%);
            width: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            overflow: hidden;
        }


        .right-team .team-name {
            font-size: 42px;
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            line-height: 1;
            max-width: 100%;
            text-align: center;
            word-spacing: 9999px;
        }

        /* ========== TEAM LOGOS IN BLUE WEDGES ========== */
        .team-logo {
            position: absolute;
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.4));
            z-index: 15;
        }

        .team-logo.home {
            left: 50%;
            top: 50%;
            transform: translate(-348px, -50%);
        }

        .team-logo.away {
            left: 50%;
            top: 50%;
            transform: translate(238px, -50%);
        }

        /* ========== CENTER SECTION ========== */
        .center-group {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 0;
            z-index: 10;
        }

        /* Blue angular sections */
        .blue-wedge {
            width: 180px;
            height: 120px;
            background: linear-gradient(180deg, #0a4560 0%, #083650 100%);
            border-top: 2px solid #a0a0a0;
            border-bottom: 2px solid #a0a0a0;
            position: relative;
        }

        .blue-wedge.left {
            clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
            border-left: 2px solid #a0a0a0;
            margin-right: -5px;
        }

        .blue-wedge.right {
            clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
            border-right: 2px solid #a0a0a0;
            margin-left: -5px;
        }

        /* Score boxes */
        .score-box {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            border: 2px solid #a0a0a0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .score-box.left {
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            margin-right: -8px;
            z-index: 13;
        }

        .score-box.right {
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
            margin-left: -8px;
            z-index: 13;
        }

        .score {
            font-size: 95px;
            font-weight: 900;
            color: #ffffff;
            text-shadow:
                2px 2px 4px rgba(0,0,0,0.9),
                0 0 10px rgba(255,255,255,0.2);
            letter-spacing: -4px;
            line-height: 1;
        }

        /* Smaller score for penalty shootouts */
        .score.penalty {
            font-size: 45px;
            letter-spacing: -1px;
        }

        /* Diamond with league logo */
        .diamond {
            width: 170px;
            height: 170px;
            background: linear-gradient(135deg, #0d4a6e 0%, #1a5a7e 50%, #0d4a6e 100%);
            transform: rotate(45deg);
            border: 2px solid #a0a0a0;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            z-index: 11;
        }

        /* White/gray accent inside diamond */
        .diamond-inner {
            position: absolute;
            width: 135px;
            height: 135px;
            background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 50%, #e8e8e8 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* League logo container */
        .league-logo-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 13;
        }

        .league-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(-45deg);
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div class="scoreboard-wrapper">
        <!-- Base blue bar -->
        <div class="base-bar"></div>

        <!-- Main gray bar -->
        <div class="main-bar"></div>

        <!-- Content container -->
        <div class="content-container">
            <!-- Left team name -->
            <div class="left-team">
                <div class="team-name" id="home-name">LA BANDEJA</div>
            </div>

            <!-- Right team name -->
            <div class="right-team">
                <div class="team-name" id="away-name">KOREA</div>
            </div>
        </div>

        <!-- Team logos (positioned in blue wedges) -->
        <img class="team-logo home" id="home-logo" src="" alt="" style="display:none;">
        <img class="team-logo away" id="away-logo" src="" alt="" style="display:none;">

        <!-- Center group with scores and logo -->
        <div class="center-group">
            <!-- Left blue wedge -->
            <div class="blue-wedge left"></div>

            <!-- Left score -->
            <div class="score-box left">
                <div class="score" id="home-score">5</div>
            </div>

            <!-- Diamond with league logo -->
            <div class="diamond">
                <div class="diamond-inner"></div>
                <div class="league-logo-wrapper">
                    <img class="league-logo" id="league-logo" src="" alt="Liga">
                </div>
            </div>

            <!-- Right score -->
            <div class="score-box right">
                <div class="score" id="away-score">5</div>
            </div>

            <!-- Right blue wedge -->
            <div class="blue-wedge right"></div>
        </div>
    </div>

    <script>
        function adjustFontSize(element, text, maxWidth) {
            // Starting font size
            let fontSize = 42;
            const minFontSize = 20;

            element.textContent = text;
            element.style.fontSize = fontSize + 'px';
            element.style.whiteSpace = 'normal';
            element.style.wordSpacing = '9999px'; // Force word wrapping

            // Reduce font size until text fits
            while (element.scrollWidth > maxWidth && fontSize > minFontSize) {
                fontSize -= 1;
                element.style.fontSize = fontSize + 'px';
            }

            // If still too long after minimum size, allow better wrapping
            if (element.scrollWidth > maxWidth) {
                element.style.wordSpacing = '0px';
                element.style.lineHeight = '0.85';
                // Try again with tighter spacing
                while (element.scrollWidth > maxWidth && fontSize > 18) {
                    fontSize -= 1;
                    element.style.fontSize = fontSize + 'px';
                }
            }
        }

        function updateScoreboard(data) {
            // Update team names with adaptive sizing
            const homeNameEl = document.getElementById('home-name');
            const awayNameEl = document.getElementById('away-name');

            adjustFontSize(homeNameEl, data.homeTeam, 240);
            adjustFontSize(awayNameEl, data.awayTeam, 240);

            // Update scores
            const homeScoreEl = document.getElementById('home-score');
            const awayScoreEl = document.getElementById('away-score');

            homeScoreEl.textContent = data.homeScore;
            awayScoreEl.textContent = data.awayScore;

            // Check if penalty shootout (contains parentheses) and apply smaller font
            if (data.homeScore.includes('(') || data.awayScore.includes('(')) {
                homeScoreEl.classList.add('penalty');
                awayScoreEl.classList.add('penalty');
            } else {
                homeScoreEl.classList.remove('penalty');
                awayScoreEl.classList.remove('penalty');
            }

            // Update home team logo
            if (data.homeLogo) {
                const homeLogo = document.getElementById('home-logo');
                homeLogo.src = data.homeLogo;
                homeLogo.style.display = 'block';
                if (data.homeLogoSize) {
                    homeLogo.style.width = data.homeLogoSize + 'px';
                    homeLogo.style.height = data.homeLogoSize + 'px';
                }
            }

            // Update away team logo
            if (data.awayLogo) {
                const awayLogo = document.getElementById('away-logo');
                awayLogo.src = data.awayLogo;
                awayLogo.style.display = 'block';
                if (data.awayLogoSize) {
                    awayLogo.style.width = data.awayLogoSize + 'px';
                    awayLogo.style.height = data.awayLogoSize + 'px';
                }
            }

            // Update league logo
            if (data.leagueLogo) {
                document.getElementById('league-logo').src = data.leagueLogo;
            }
        }

        // Test data
        const testData = {
            homeTeam: 'LA BANDEJA',
            awayTeam: 'KOREA',
            homeScore: '5',
            awayScore: '5',
            homeLogo: '',
            awayLogo: '',
            leagueLogo: ''
        };

        window.onload = () => updateScoreboard(testData);
    </script>
</body>
</html>
